<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevSentry</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>DevSentry</h1>
        <p>AI-Powered DevOps Engineer</p>
    </header>

    <main>
        <section id="chat-container">
            <div id="messages"></div>

            <form id="chat-form">
                <input
                    id="message-input"
                    type="text"
                    placeholder="Ask DevSentry a DevOps question..."
                    autocomplete="off"
                    required
                />

                <button type="submit">Send</button>
            </form>
        </section>
    </main>

    <script src="app.js?v=2"></script>

</body>
</html>
